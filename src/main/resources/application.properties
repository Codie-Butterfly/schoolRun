server.port=${PORT:9200}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/schoolrun;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.error.include-message=always
schoolrun.uploads=${UPLOADS_DIR:./data/private-files}
schoolrun.subscription-price=${SUBSCRIPTION_PRICE:1}
schoolrun.subscription-unit=${SUBSCRIPTION_UNIT:CHILD}
schoolrun.currency=${SUBSCRIPTION_CURRENCY:USD}
paynow.integration-id=${PAYNOW_INTEGRATION_ID:}
paynow.integration-key=${PAYNOW_INTEGRATION_KEY:}
paynow.public-base-url=${PUBLIC_BASE_URL:}
paynow.enabled=${PAYNOW_ENABLED:false}
paynow.test-mode=${PAYNOW_TEST_MODE:true}
paynow.test-email=${PAYNOW_TEST_EMAIL:}

paynow.test-driver-ids=${PAYNOW_TEST_DRIVER_IDS:}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

schoolrun.mock-subscriptions=${MOCK_SUBSCRIPTIONS:false}
